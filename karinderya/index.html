<style>
/* Full-screen canvas game. Single committed look (warm wood), so colors are fixed rather than themed. */
:root{--wood:#2b1d16;color-scheme:dark}
html{height:100%;box-sizing:border-box}
body{height:100%;margin:0;background:var(--wood);overflow:hidden;overscroll-behavior:none}
#game{display:block;width:100%;height:100%;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;outline:none}
</style>
</head>
<body>
<canvas id="game" aria-label="Karinderya ni Lola: a cooking and serving game"></canvas>
<script>
(()=>{
'use strict';
const W=360,H=640,TAU=Math.PI*2;
const PAL={ink:'#2b1d16',wall:'#8fd3b6',wallDark:'#5fb08e',tileA:'#f1e4c8',tileB:'#d9c39b',wood:'#c98a4b',woodDark:'#9c6235',woodLight:'#dca468',
glass:'#c4e8f2',frame:'#5a6b78',pot:'#9aa7b3',potDark:'#6e7b87',potRim:'#d3dbe2',adobo:'#6b3a1e',adoboHi:'#8a5230',chicken:'#b5653a',chickenHi:'#d9905d',
garlic:'#f3e7c9',bay:'#5f8a3a',pepper:'#1a1a1a',sinigang:'#d8c77a',kangkong:'#4f9d48',torta:'#e8b84a',white:'#ffffff',riceShade:'#e6e4da',red:'#d7263d',
yellow:'#ffc93c',blue:'#1f4e9c',street:'#55585e',line:'#f2f2f2',sidewalk:'#a7a49c',silver:'#c9ced4',skin1:'#c98e62',skin2:'#a8714a',skin3:'#e0ad85',
hair:'#1d1612',hair2:'#4a3426',grayhair:'#b9b4ad',sh1:'#3a86c8',sh2:'#e76f51',sh3:'#2a9d8f',sh4:'#f4a261',sh5:'#9b5de5',sh6:'#ef476f',apron:'#f7f3ea',
pants:'#34495e',paper:'#fff4c2',paperLine:'#e7c96b',green:'#3fa34d',flame:'#3d7bff',flameLt:'#9cc3ff',dark:'#1b2430',night:'#1c2541',eggFlesh:'#b49a5a',
board:'#e2b77c',boardDark:'#c08f55',knife:'#dfe5ea',muted:'#7a6a5c',plant:'#3f8f4f'};
const INK=PAL.ink;
const FONT={d:'"Bowlby One","Arial Black",sans-serif',b:'"Figtree",system-ui,sans-serif',h:'"Caveat","Comic Sans MS",cursive'};

/* ---------- helpers ---------- */
const rand=(a,b)=>a+Math.random()*(b-a), clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const hexRGB=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
function mix(a,b,t){const A=hexRGB(a),B=hexRGB(b);t=clamp(t,0,1);return `rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')})`;}
function rr(c,x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function sh(c,fill,build,lw=3){c.beginPath();build();if(fill){c.fillStyle=fill;c.fill();}if(lw){c.lineWidth=lw;c.strokeStyle=INK;c.lineJoin='round';c.lineCap='round';c.stroke();}}
function shadow(c,x,y,rx,ry){c.globalAlpha=.2;c.fillStyle='#000';c.beginPath();c.ellipse(x,y,rx,ry,0,0,TAU);c.fill();c.globalAlpha=1;}
function txt(c,s,x,y,size,role='b',col=INK,align='left',weight=''){c.font=`${weight} ${size}px ${FONT[role]}`;c.fillStyle=col;c.textAlign=align;c.textBaseline='alphabetic';c.fillText(s,x,y);}
function txtS(c,s,x,y,size,role='d',col=PAL.white,align='center',weight=''){c.font=`${weight} ${size}px ${FONT[role]}`;c.textAlign=align;c.textBaseline='alphabetic';c.lineJoin='round';c.lineWidth=Math.max(3,size/4);c.strokeStyle=INK;c.strokeText(s,x,y);c.fillStyle=col;c.fillText(s,x,y);}
function wrap(c,s,x,y,maxW,lh){const words=s.split(' ');let line='';for(const w of words){const t=line?line+' '+w:w;if(c.measureText(t).width>maxW&&line){c.fillText(line,x,y);line=w;y+=lh;}else line=t;}c.fillText(line,x,y);return y;}
function wrapS(c,s,x,y,maxW,lh){const words=s.split(' ');let line='';const out=[];for(const w of words){const t=line?line+' '+w:w;if(c.measureText(t).width>maxW&&line){out.push(line);line=w;}else line=t;}out.push(line);
  out.forEach((l,i)=>{c.strokeText(l,x,y+i*lh);c.fillText(l,x,y+i*lh);});}
const peso=n=>`₱${Math.round(n).toLocaleString('en-US')}`;

/* ---------- sound ---------- */
let AC=null,soundOn=true;
function beep(f,d,type,v){if(!soundOn)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+d+.02);}catch(e){}}
const SFX={tap:()=>beep(520,.05,'triangle',.06),good:()=>{beep(660,.08,'triangle',.07);setTimeout(()=>beep(990,.12,'triangle',.07),70);},
  bad:()=>beep(170,.18,'sawtooth',.035),coin:()=>{beep(1250,.05,'square',.025);setTimeout(()=>beep(1680,.09,'square',.025),55);},chop:()=>beep(320,.035,'square',.035),
  win:()=>[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.14,'triangle',.06),i*90))};

/* ---------- drawing pieces ---------- */
function person(c,x,y,o){
  const b=o.bob||0;
  shadow(c,x,y,15,5);
  if(o.seated)sh(c,PAL.red,()=>c.ellipse(x,y-4,11,6,0,0,TAU));
  else{const s=o.step||0;sh(c,PAL.pants,()=>rr(c,x-8,y-11-Math.max(0,s)*3,6,11,2),2);sh(c,PAL.pants,()=>rr(c,x+2,y-11-Math.max(0,-s)*3,6,11,2),2);}
  const by=o.seated?y-24:y-27;
  sh(c,o.shirt,()=>rr(c,x-12,by+b,24,19,8));
  if(o.apron)sh(c,PAL.apron,()=>rr(c,x-7,by+4+b,14,14,3),2);
  const hy=by-12+b;
  sh(c,o.skin,()=>c.arc(x,hy,14,0,TAU));
  if(o.back){sh(c,o.hair,()=>c.arc(x,hy-1,14,0,TAU));}
  else{
    c.beginPath();c.arc(x,hy-1,14,Math.PI*1.02,Math.PI*1.98);c.closePath();c.fillStyle=o.hair;c.fill();
    c.beginPath();c.arc(x,hy,14,0,TAU);c.lineWidth=3;c.strokeStyle=INK;c.stroke();
    c.fillStyle=INK;c.beginPath();c.arc(x-5,hy+2,2,0,TAU);c.arc(x+5,hy+2,2,0,TAU);c.fill();
    c.lineWidth=2;c.beginPath();if(o.angry){c.arc(x,hy+9,3,1.15*Math.PI,1.85*Math.PI);}else c.arc(x,hy+6,3,.15*Math.PI,.85*Math.PI);c.stroke();
    if(o.band)sh(c,PAL.red,()=>rr(c,x-14,hy-9,28,5,2),2);
  }
  if(o.cap){sh(c,PAL.blue,()=>{c.arc(x,hy-3,14,Math.PI,TAU);c.closePath();},2.5);if(!o.back)sh(c,PAL.blue,()=>rr(c,x-4,hy-6,20,5,2),2);}
}
function foodIcon(c,x,y,kind,s=1){
  c.save();c.translate(x,y);c.scale(s,s);
  if(kind==='rice'){sh(c,PAL.blue,()=>{c.moveTo(-9,0);c.lineTo(9,0);c.arc(0,0,9,0,Math.PI);},2);sh(c,PAL.white,()=>c.arc(0,0,7,Math.PI,TAU),2);}
  else if(kind==='sinangag'){sh(c,PAL.blue,()=>{c.moveTo(-9,0);c.lineTo(9,0);c.arc(0,0,9,0,Math.PI);},2);sh(c,'#e6b85c',()=>c.arc(0,0,7,Math.PI,TAU),2);c.fillStyle=PAL.kangkong;c.fillRect(-3,-4,2,2);c.fillRect(2,-3,2,2);}
  else if(kind==='sabaw'){sh(c,PAL.white,()=>c.ellipse(0,1,10,6,0,0,TAU),2);sh(c,PAL.sinigang,()=>c.ellipse(0,0,7,3.5,0,0,TAU),0);c.fillStyle=PAL.kangkong;c.fillRect(-3,-1,4,2);}
  else{const D=DISH[kind]||DISH.adobo;sh(c,PAL.white,()=>c.ellipse(0,1,10,6,0,0,TAU),2);
    if(D.fish){sh(c,D.col,()=>{c.ellipse(-1,0,6,3,0,0,TAU);},0);c.fillStyle=D.col;c.beginPath();c.moveTo(4,0);c.lineTo(8,-3);c.lineTo(8,3);c.closePath();c.fill();c.fillStyle=INK;c.fillRect(-5,-1,1.5,1.5);}
    else{sh(c,D.col,()=>c.ellipse(0,0,7,3.8,0,0,TAU),0);c.fillStyle=D.bit;c.beginPath();c.arc(-2,-.5,1.6,0,TAU);c.arc(2.5,.5,1.4,0,TAU);c.fill();}}
  c.restore();
}
function bubble(c,x,y,kind,pat){
  sh(c,PAL.white,()=>rr(c,x-16,y-16,32,26,8));
  c.fillStyle=PAL.white;c.beginPath();c.moveTo(x-4,y+8);c.lineTo(x+4,y+8);c.lineTo(x,y+15);c.closePath();c.fill();
  c.strokeStyle=INK;c.lineWidth=3;c.beginPath();c.moveTo(x-4,y+10);c.lineTo(x,y+15);c.lineTo(x+4,y+10);c.stroke();
  foodIcon(c,x,y-3,kind);
  if(pat!=null){const col=pat>.55?PAL.green:pat>.28?PAL.yellow:PAL.red;sh(c,INK,()=>rr(c,x-14,y-25,28,6,3),0);sh(c,col,()=>rr(c,x-13,y-24,26*Math.max(.05,pat),4,2),0);}
}
function heart(c,x,y,s,col=PAL.red){c.save();c.translate(x,y);c.scale(s,s);sh(c,col,()=>{c.moveTo(0,6);c.bezierCurveTo(-12,-2,-6,-12,0,-5);c.bezierCurveTo(6,-12,12,-2,0,6);},2/s);c.restore();}
function star(c,x,y,r,col){sh(c,col,()=>{for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,q=i%2?r*.45:r;c.lineTo(x+Math.cos(a)*q,y+Math.sin(a)*q);}c.closePath();},Math.max(1.5,r/6));}
function stars(c,x,y,r,n,gap){for(let i=0;i<3;i++)star(c,x+(i-1)*gap,y,r,i<n?PAL.yellow:PAL.riceShade);}
function lockIcon(c,x,y){c.lineWidth=3;c.strokeStyle=PAL.muted;c.beginPath();c.arc(x,y-4,6,Math.PI,TAU);c.stroke();sh(c,PAL.muted,()=>rr(c,x-9,y-4,18,14,3),0);}
function bgWood(c){c.fillStyle=PAL.wood;c.fillRect(V.x0,V.y0,V.x1-V.x0,V.y1-V.y0);
  c.strokeStyle=PAL.woodDark;c.lineWidth=3;for(let y=Math.floor(V.y0/58)*58+46;y<V.y1;y+=58){c.beginPath();c.moveTo(V.x0,y);c.lineTo(V.x1,y);c.stroke();}
  c.lineWidth=2;c.strokeStyle=PAL.woodLight;for(let i=0;i<40;i++){const gx=V.x0+((i*97)%Math.max(1,(V.x1-V.x0))),gy=V.y0+((i*61)%Math.max(1,(V.y1-V.y0)));c.beginPath();c.moveTo(gx,gy);c.lineTo(gx+30,gy+2);c.stroke();}}
function paperBox(c,x,y,w,h,title){
  sh(c,PAL.paper,()=>rr(c,x,y,w,h,8));
  c.strokeStyle=PAL.paperLine;c.lineWidth=1.5;for(let ly=y+28;ly<y+h-6;ly+=20){c.beginPath();c.moveTo(x+8,ly);c.lineTo(x+w-8,ly);c.stroke();}
  c.strokeStyle=PAL.red;c.beginPath();c.moveTo(x+26,y+4);c.lineTo(x+26,y+h-4);c.stroke();
  if(title)txt(c,title,x+34,y+18,10,'b',PAL.red,'left','800');
}

/* ---------- buttons ---------- */
let btns=[],pressed=null,pressT=0;
function button(c,id,x,y,w,h,label,o={}){
  const dis=!!o.disabled;if(!dis)btns.push({id,x,y,w,h});
  const down=pressed===id&&pressT<.15?3:0;
  sh(c,INK,()=>rr(c,x,y+4,w,h,12),0);
  sh(c,dis?PAL.riceShade:(o.fill||PAL.yellow),()=>rr(c,x,y+down,w,h,12));
  txt(c,label,x+w/2,y+down+h/2+(o.size||16)*.36,o.size||16,'d',dis?PAL.muted:(o.col||INK),'center');
}

/* ---------- game data ---------- */
const DISH={adobo:{col:'#6b3a1e',bit:'#d9905d'},torta:{col:'#e8b84a',bit:'#9a6a1e'},sinigang:{col:'#d8c77a',bit:'#4f9d48'},
  isda:{col:'#8a97a3',bit:'#c98a4b',fish:true},menudo:{col:'#c4482a',bit:'#f2c14e'}};
const MAX_KALDERO=3,CARRY_MAX=6;
const RECIPES={
  adobo:{name:'Adobong Manok',short:'adobo',price:60,cost:300,servings:10,unlock:1,steps:[
    {type:'chop',title:'Hiwain ang bawang',how:'I-tap kapag nasa dilaw na linya ang kutsilyo.',tip:'Pino ang hiwa, apo, para lumabas ang bango.'},
    {type:'flip',title:'Prituhin ang manok',how:'I-tap para baligtarin kapag nasa berde ang init.',tip:'Hintayin mag-golden bago baligtarin.',item:'chicken',n:3,rate:.45,pan:'kawali'},
    {type:'pour',title:'Ibuhos ang toyo at suka',how:'Pindutin nang matagal para magbuhos. Bitawan sa berdeng guhit.',tip:'Una ang toyo, saka ang suka. Huwag sobra.',contents:'chicken',
      liquids:[{name:'TOYO',col:'#2a1610',bottle:'#1b2430',band:[.36,.48]},{name:'SUKA',col:'#d9c9a0',bottle:'#e9f3f3',band:[.72,.84]}]},
    {type:'stir',title:'Pakuluan at haluin',how:'I-drag nang pabilog sa kaldero. Huwag masyadong mabilis.',tip:'Dahan-dahan, pabilog. Hayaang kumapit ang sarsa.',pot:'adobo'}]},
  torta:{name:'Tortang Talong',short:'torta',price:45,cost:200,servings:10,unlock:1,steps:[
    {type:'flip',title:'Ihawin ang talong',how:'I-tap para ikutin kapag sunog na ang balat, bago maging abo.',tip:'Sunugin ang balat, hindi ang laman.',item:'eggplant',n:3,rate:.5,pan:'grill'},
    {type:'mash',title:'Pitpitin ang talong',how:'I-tap nang mabilis para pitpitin gamit ang tinidor.',tip:'Pitpitin hanggang lumapad, parang pamaypay.'},
    {type:'flip',title:'Iprito sa itlog',how:'Baligtarin kapag golden na ang ilalim.',tip:'Mahinang apoy lang sa itlog, apo.',item:'torta',n:2,rate:.4,pan:'kawali'}]},
  sinigang:{name:'Sinigang na Baboy',short:'sinigang',price:75,cost:350,servings:10,unlock:2,steps:[
    {type:'chop',item:'tomato',title:'Hiwain ang kamatis',how:'I-tap kapag nasa dilaw na linya ang kutsilyo.',tip:'Hiwain nang pakuwarto ang kamatis.'},
    {type:'pour',title:'Ilagay ang sampalok',how:'Pindutin nang matagal. Bitawan sa berdeng guhit para tama ang asim.',tip:'Tikman mo, apo. Asim na tama lang.',contents:'pork',
      liquids:[{name:'ASIM',col:'#b9a24a',bottle:'#7a9a3a',band:[.55,.67]}]},
    {type:'stir',title:'Pakuluan kasama ang kangkong',how:'I-drag nang pabilog sa kaldero. Huwag masyadong mabilis.',tip:'Huli ang kangkong para hindi malata.',pot:'sinigang'}]},
  isda:{name:'Pritong Galunggong',short:'isda',price:50,cost:220,servings:10,unlock:3,steps:[
    {type:'mash',item:'fish',title:'Kuskusin ng asin',how:'I-tap nang mabilis para maasinan ang isda.',tip:'Asin sa labas at loob, apo.'},
    {type:'flip',title:'Iprito ang isda',how:'I-tap para baligtarin kapag malutong na.',tip:'Mainit na mantika para malutong.',item:'fish',n:3,rate:.5,pan:'kawali'}]},
  menudo:{name:'Menudo',short:'menudo',price:65,cost:320,servings:10,unlock:4,steps:[
    {type:'chop',item:'potato',title:'Hiwain ang patatas at karot',how:'I-tap kapag nasa dilaw na linya ang kutsilyo.',tip:'Pare-pareho ang laki para sabay maluto.'},
    {type:'pour',title:'Ibuhos ang tomato sauce',how:'Pindutin nang matagal. Bitawan sa berdeng guhit.',tip:'Huwag sobra sa sarsa, apo.',contents:'pork',
      liquids:[{name:'SARSA',col:'#b8321e',bottle:'#b8321e',band:[.5,.62]}]},
    {type:'stir',title:'Pakuluan at haluin',how:'I-drag nang pabilog sa kaldero. Huwag masyadong mabilis.',tip:'Hintaying lumambot ang patatas.',pot:'menudo'}]}
};
const LOCKED=['Kare-kare'];
const G={day:1,money:500,cooked:{},todayCost:0,
  suki:[{id:'kanor',name:'Mang Kanor',fav:'adobo',hearts:0,look:{shirt:PAL.sh1,skin:PAL.skin2,hair:PAL.hair,cap:true},line:'Sarap! Parang luto ng Lola mo.'},
        {id:'bebang',name:'Aling Bebang',fav:'torta',hearts:0,look:{shirt:PAL.sh5,skin:PAL.skin3,hair:PAL.grayhair},line:'Salamat, anak! Suki na ako dito.'}]};
const LOOKS=[[PAL.sh2,PAL.skin1,PAL.hair],[PAL.sh3,PAL.skin2,PAL.hair2],[PAL.sh4,PAL.skin3,PAL.hair],[PAL.sh6,PAL.skin1,PAL.hair2],[PAL.green,PAL.skin2,PAL.hair],[PAL.sh1,PAL.skin3,PAL.grayhair],[PAL.red,PAL.skin1,PAL.hair]];
const APO={shirt:PAL.yellow,skin:PAL.skin1,hair:PAL.hair,apron:true,band:true};

/* ---------- mini-games ---------- */
function tickFlash(m,dt){if(m.flash){m.flash.t+=dt;if(m.flash.t>.9)m.flash=null;}}
function tickEnd(m,dt){if(m.endT!=null){m.endT-=dt;if(m.endT<=0)m.done=true;}}
function setFlash(m,s,t){m.flash={txt:t||(s>=1?'Ayos!':s>.5?'Pwede na':'Sablay!'),s,t:0};}
function drawFlash(c,m,y=220){const f=m.flash;if(!f)return;c.globalAlpha=Math.max(0,1-f.t/.9);txtS(c,f.txt,180,y-f.t*30,28,'d',f.s>=1?PAL.green:f.s>.5?PAL.yellow:PAL.red);c.globalAlpha=1;}

function mgChop(st){const item=st.item||'garlic';
  const m={t:0,i:0,n:6,marks:[],cuts:[],scores:[],kx:180,dip:0,flash:null,endT:null,done:false};
  for(let i=0;i<6;i++)m.marks.push(112+i*27);
  m.update=dt=>{m.t+=dt;m.kx=180+118*Math.sin(m.t*(1.9+m.i*.22));m.dip=Math.max(0,m.dip-dt*6);tickFlash(m,dt);tickEnd(m,dt);};
  m.down=()=>{if(m.i>=m.n)return;const d=Math.abs(m.kx-m.marks[m.i]);const s=d<8?1:d<18?.65:.25;m.scores.push(s);m.cuts.push(m.kx);m.dip=1;setFlash(m,s);s>.5?SFX.chop():SFX.bad();m.i++;if(m.i>=m.n)m.endT=.8;};
  m.score=()=>avg(m.scores);
  m.draw=c=>{
    shadow(c,180,425,140,10);
    sh(c,PAL.board,()=>rr(c,40,250,280,170,18));
    c.strokeStyle=PAL.boardDark;c.lineWidth=2;for(let i=0;i<5;i++){c.beginPath();c.moveTo(60,272+i*30);c.lineTo(300,276+i*30);c.stroke();}
    for(let j=0;j<5;j++){const x=105+j*38;
      if(item==='tomato'){sh(c,'#d94a3a',()=>c.arc(x,336,22,0,TAU));sh(c,PAL.kangkong,()=>c.arc(x,320,4,0,TAU),2);}
      else if(item==='potato'){sh(c,j%2?'#e8792e':'#e3c27a',()=>rr(c,x-20,318,40,36,12));}
      else sh(c,PAL.garlic,()=>c.ellipse(x,336,24,19,(j%2?.2:-.15),0,TAU));}
    c.strokeStyle=INK;c.lineWidth=3;for(const x of m.cuts){c.beginPath();c.moveTo(x,314);c.lineTo(x,358);c.stroke();}
    if(m.i<m.n){const x=m.marks[m.i];c.setLineDash([7,6]);c.strokeStyle=PAL.yellow;c.lineWidth=5;c.beginPath();c.moveTo(x,292);c.lineTo(x,382);c.stroke();c.setLineDash([]);
      sh(c,PAL.yellow,()=>{c.moveTo(x-8,282);c.lineTo(x+8,282);c.lineTo(x,294);c.closePath();},2);}
    const dy=m.dip*16,kx=m.kx;

  S.update=dt=>{

    const P=S.P;

    for(const c of S.custs){
      if(c.path.length){const t=c.path[0],dx=t.x-c.x,dy=t.y-c.y,d=Math.hypot(dx,dy);c.moving=true;c.ph+=dt*10;

    c.fillStyle=PAL.line;for(let x=Math.floor(V.x0/40)*40;x<V.x1;x+=40)c.fillRect(x,612,22,3);

    for(const t of S.tables)ents.push({y:t.y+18,d:()=>{const w=64,h=36;shadow(c,t.x,t.y+22,34,6);
      c.strokeStyle=INK;c.lineWidth=3;c.beginPath();c.moveTo(t.x-w/2+6,t.y+h/2);c.lineTo(t.x-w/2+6,t.y+h/2+8);c.moveTo(t.x+w/2-6,t.y+h/2);c.lineTo(t.x+w/2-6,t.y+h/2+8);c.stroke();
      sh(c,PAL.white,()=>rr(c,t.x-w/2,t.y-h/2,w,h,4));c.strokeStyle=PAL.red;c.lineWidth=2;c.globalAlpha=.5;
      for(let i=1;i<4;i++){c.beginPath();c.moveTo(t.x-w/2+i*w/4,t.y-h/2+2);c.lineTo(t.x-w/2+i*w/4,t.y+h/2-2);c.stroke();}c.beginPath();c.moveTo(t.x-w/2+2,t.y);c.lineTo(t.x+w/2-2,t.y);c.stroke();c.globalAlpha=1;
      c.strokeStyle=INK;c.lineWidth=3;c.beginPath();rr(c,t.x-w/2,t.y-h/2,w,h,4);c.stroke();
      for(const s of S.seats){if(s.t!==t)continue;const px=t.x+s.side*16,py=t.y;
        if(s.occ&&s.occ.state==='eat')foodIcon(c,px,py,s.occ.dish);
        else if(s.plate){sh(c,PAL.white,()=>c.ellipse(px,py+1,10,6,0,0,TAU),2);c.fillStyle=PAL.adobo;c.beginPath();c.arc(px-3,py,1.5,0,TAU);c.arc(px+2,py+2,1.3,0,TAU);c.arc(px+4,py-1,1.2,0,TAU);c.fill();
          c.fillStyle=INK;for(let f=0;f<2;f++){const a=S.t*(5+f*2)+f*3;c.beginPath();c.arc(px+Math.cos(a)*12,py-10+Math.sin(a*1.3)*6,1.8,0,TAU);c.fill();}}}}});
    for(const cu of S.custs){const back=cu.state==='wait'||cu.state==='plating'||(cu.moving&&cu.vy<-Math.abs(cu.vx)*.6);
      ents.push({y:cu.y,d:()=>{person(c,cu.x,cu.y,{...cu.look,seated:cu.state==='eat',back,angry:cu.angry,step:cu.moving?Math.sin(cu.ph):0,bob:cu.moving?-Math.abs(Math.sin(cu.ph))*2:Math.sin(S.t*2+cu.ph)});
        if(cu.state==='toSeat')foodIcon(c,cu.x,cu.y-22,cu.dish,1.1);}});}
    const P=S.P;
    ents.push({y:P.y,d:()=>person(c,P.x,P.y,{...APO,back:P.moving&&P.vy<-Math.abs(P.vx)*.6,step:P.moving?Math.sin(P.ph):0,bob:P.moving?-Math.abs(Math.sin(P.ph))*2:(S.busy>0?Math.sin(S.t*20)*2:0)})});
    ents.sort((a,b)=>a.y-b.y).forEach(e=>e.d());
    if(S.marker){const m=S.marker;c.globalAlpha=1-m.t/.5;c.strokeStyle=PAL.white;c.lineWidth=3;c.beginPath();c.ellipse(m.x,m.y,8+m.t*30,4+m.t*15,0,0,TAU);c.stroke();c.globalAlpha=1;}
    if(S.carry>0){for(let i=0;i<S.carry;i++)sh(c,PAL.white,()=>c.ellipse(P.x,P.y-62-i*4,14,5,0,0,TAU),2);txtS(c,`×${S.carry}`,P.x+24,P.y-58,12,'b',PAL.white,'left','800');}
    else{const ty=P.y-68+Math.sin(S.t*4)*3;sh(c,PAL.yellow,()=>{c.moveTo(P.x-7,ty);c.lineTo(P.x+7,ty);c.lineTo(P.x,ty+9);c.closePath();},2);}
    for(const cu of S.custs){
      if(cu.state==='wait')orderBubble(c,cu.x,cu.y-78,cu.order,cu.pat);
      if(cu.suki&&cu.state!=='out'){c.font=`800 9px ${FONT.b}`;const tw=c.measureText(cu.suki.name).width+18;sh(c,PAL.red,()=>rr(c,cu.x-tw/2,cu.y+4,tw,14,7),2);
        txt(c,cu.suki.name,cu.x+5,cu.y+14,9,'b',PAL.white,'center','800');heart(c,cu.x-tw/2+8,cu.y+11,.45,PAL.white);}}

    for(const p of S.pops){c.globalAlpha=Math.max(0,1-p.age/p.dur);if(p.size<14){c.font=`800 ${p.size}px ${FONT.b}`;c.lineWidth=4;c.strokeStyle=INK;c.fillStyle=p.col;c.textAlign='center';c.lineJoin='round';wrapS(c,p.t,clamp(p.x,90,270),p.y-p.age*24,170,15);}
      else txtS(c,p.t,clamp(p.x,40,320),p.y-p.age*24,p.size,'d',p.col);}c.globalAlpha=1;
    // HUD
    const mins=11*60+Math.min(S.t,S.dur)/S.dur*180,hh=Math.floor(mins/60),mm=Math.floor(mins%60);
    const tl=`ARAW ${G.day} · ${((hh+11)%12)+1}:${String(mm).padStart(2,'0')} ${hh>=12?'PM':'AM'}`;
    c.font=`800 11px ${FONT.b}`;const tw=c.measureText(tl).width+20,hx=Math.max(V.x0+10,-60);
    sh(c,PAL.white,()=>rr(c,hx,8,tw,24,12),2.5);txt(c,tl,hx+10,24,11,'b',INK,'left','800');
    sh(c,INK,()=>rr(c,hx,36,tw,6,3),0);sh(c,PAL.yellow,()=>rr(c,hx+1,37,(tw-2)*Math.min(1,S.t/S.dur),4,2),0);
    const mt=peso(G.money);c.font=`15px ${FONT.d}`;const mw2=c.measureText(mt).width+22,rx=Math.min(V.x1-10,W+60)-mw2;
    sh(c,PAL.yellow,()=>rr(c,rx,8,mw2,24,12),2.5);txt(c,mt,rx+mw2/2,26,15,'d',INK,'center');

    if(S.ended){c.globalAlpha=Math.min(.55,S.endT);c.fillStyle='#000';c.fillRect(V.x0,V.y0,V.x1-V.x0,V.y1-V.y0);c.globalAlpha=1;
      const s=Math.min(1,S.endT*3);c.save();c.translate(180,300);c.scale(s,s);sh(c,PAL.yellow,()=>rr(c,-140,-50,280,100,18),4);txt(c,S.endMsg,0,12,30,'d',PAL.red,'center');c.restore();}

function makeEvening(st){
  const left=Object.values(G.cooked).reduce((a,v)=>a+v.left,0)/2;
  const profit=st.earn-G.todayCost;
  const S={t:0};
  S.update=dt=>{S.t+=dt;};
  S.onBtn=id=>{if(id==='next'){G.day++;G.cooked={};G.todayCost=0;go(makeMorning());}};
  S.draw=c=>{
    c.fillStyle=PAL.night;c.fillRect(V.x0,V.y0,V.x1-V.x0,V.y1-V.y0);
    c.fillStyle='#fff';for(let i=0;i<30;i++){const x=V.x0+((i*137)%Math.max(1,V.x1-V.x0)),y=V.y0+((i*71)%60)+10;c.globalAlpha=.4+.4*Math.sin(S.t*2+i);c.fillRect(x,y,2,2);}c.globalAlpha=1;
    sh(c,PAL.paper,()=>rr(c,20,30,320,580,14),4);
    txt(c,`ARAW ${G.day}`,180,78,30,'d',INK,'center');
    txt(c,'Tapos na ang araw!',180,106,25,'h',INK,'center','600');
    const rows=[['Benta',peso(st.earn)],['Puhunan',`−${peso(G.todayCost)}`],['Tubo',`${profit<0?'−':''}${peso(Math.abs(profit))}`,profit>=0?PAL.green:PAL.red],null,
      ['Tamang order',st.served],['Mali ang order',st.wrong,st.wrong?PAL.red:INK],['Nainip at umalis',st.lost,st.lost?PAL.red:INK],
      ['Sinangag',st.sinangag],['Extra rice',st.extra],['Platong hinugasan',st.washed],['Tira sa kaldero',`${left} servings`]];
    let y=138;for(const r of rows){if(!r){c.strokeStyle=PAL.paperLine;c.lineWidth=2;c.beginPath();c.moveTo(44,y-8);c.lineTo(316,y-8);c.stroke();y+=8;continue;}
      txt(c,r[0],44,y,15,'b',INK,'left','600');txt(c,String(r[1]),316,y,15,'b',r[2]||INK,'right','800');y+=24;}
    y+=6;txt(c,'MGA SUKI',44,y,11,'b',PAL.red,'left','800');y+=24;
    for(const s of G.suki){txt(c,s.name,44,y,15,'d',INK);for(let i=0;i<5;i++)heart(c,234+i*20,y-5,.7,i<s.hearts?PAL.red:PAL.riceShade);y+=26;}
    c.fillStyle=INK;c.font=`600 23px ${FONT.h}`;c.textAlign='center';
    const good=st.lost===0&&st.wrong===0&&st.served>0;
    wrap(c,good?'"Walang umalis na gutom, walang maling order. Proud ako sa\'yo."':st.served===0?'"Bukas, subukan natin ulit."':st.wrong>st.lost?'"Tingnan mabuti ang order, apo."':'"Bukas, bilisan pa natin, apo."',180,y+6,270,22);
    button(c,'next',50,540,260,50,'SUSUNOD NA ARAW',{size:17,fill:PAL.red,col:PAL.white});
    txt(c,`Kabuuang pera: ${peso(G.money)}`,180,630,13,'b',PAL.white,'center','800');
  };
  return S;
}
/* ---------- engine ---------- */
const cv=document.getElementById('game'),ctx=cv.getContext('2d');
let sc=1,ox=0,oy=0;const V={x0:0,x1:W,y0:0,y1:H};
function resize(){const dpr=Math.min(2,window.devicePixelRatio||1);const r=cv.getBoundingClientRect();cv.width=Math.max(1,Math.round(r.width*dpr));cv.height=Math.max(1,Math.round(r.height*dpr));
  sc=Math.min(cv.width/W,cv.height/H);ox=(cv.width-W*sc)/2;oy=(cv.height-H*sc)/2;V.x0=-ox/sc;V.x1=W+ox/sc;V.y0=-oy/sc;V.y1=H+oy/sc;}
function toL(e){const r=cv.getBoundingClientRect();const dpr=cv.width/r.width;return{x:((e.clientX-r.left)*dpr-ox)/sc,y:((e.clientY-r.top)*dpr-oy)/sc};}
cv.addEventListener('pointerdown',e=>{e.preventDefault();const p=toL(e);
  for(let i=btns.length-1;i>=0;i--){const b=btns[i];if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y-2&&p.y<=b.y+b.h+6){pressed=b.id;pressT=0;SFX.tap();scene.onBtn&&scene.onBtn(b.id);return;}}
  try{cv.setPointerCapture(e.pointerId);}catch(_){}scene.down&&scene.down(p);});
cv.addEventListener('pointermove',e=>{if(scene.move)scene.move(toL(e));});
const pu=e=>{if(scene.up)scene.up(toL(e));};cv.addEventListener('pointerup',pu);cv.addEventListener('pointercancel',pu);
cv.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('resize',resize);if(window.ResizeObserver)new ResizeObserver(resize).observe(cv);
resize();go(makeTitle());
window.KD={G,get scene(){return scene;}};
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;pressT+=dt;
  try{scene.update&&scene.update(dt);
    ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle=PAL.ink;ctx.fillRect(0,0,cv.width,cv.height);
    ctx.setTransform(sc,0,0,sc,ox,oy);btns=[];scene.draw(ctx);}catch(err){console.error(err);}
  requestAnimationFrame(frame);}
requestAnimationFrame(frame);
})();
</script>
